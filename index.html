<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valor por m²</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5b6475;
      --border: #d7dbe3; --accent: #1f6feb; --erro: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b5;
        --border: #2d3442; --accent: #58a6ff; --erro: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 440px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 18px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    fieldset {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px 0; margin: 0 0 20px;
    }
    legend { font-weight: 700; padding: 0 6px; }
    legend small { font-weight: 400; color: var(--muted); }
    .modo { display: flex; gap: 6px; margin-bottom: 14px; }
    .modo label {
      flex: 1; margin: 0; padding: 8px; text-align: center; font-weight: 500;
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .modo input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
    .modo input:checked + span { color: var(--accent); font-weight: 700; }
    .modo label:has(input:checked) { border-color: var(--accent); }
    .modo label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    .lado { display: flex; gap: 12px; }
    .lado > div { flex: 1; }
    [hidden] { display: none !important; }
    button {
      width: 100%; padding: 12px; font-size: 1rem; font-weight: 600;
      border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
    }
    #resultado { margin-top: 22px; }
    .linha { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .linha:first-child { border-top: 0; }
    .linha span { color: var(--muted); }
    .linha strong { font-size: 1.25rem; white-space: nowrap; }
    .erro { color: var(--erro); }
  </style>
</head>
<body>
  <main>
    <h1>Valor por m²</h1>
    <p class="sub">Informe o valor do imóvel, a área construída e o terreno.</p>
    <form id="form" novalidate>
      <label for="valor">Valor do imóvel (R$)</label>
      <input id="valor" inputmode="decimal" placeholder="Ex.: 450.000,00">

      <label for="construida">Área construída (m²)</label>
      <input id="construida" inputmode="decimal" placeholder="Ex.: 72,5">

      <fieldset>
        <legend>Terreno <small>(opcional)</small></legend>
        <div class="modo">
          <label><input type="radio" name="modo" value="medidas" checked><span>Frente × fundo</span></label>
          <label><input type="radio" name="modo" value="area"><span>Área total</span></label>
        </div>
        <div id="campos-medidas" class="lado">
          <div>
            <label for="frente">Frente (m)</label>
            <input id="frente" inputmode="decimal" placeholder="Ex.: 10">
          </div>
          <div>
            <label for="fundo">Fundo (m)</label>
            <input id="fundo" inputmode="decimal" placeholder="Ex.: 30">
          </div>
        </div>
        <div id="campos-area" hidden>
          <label for="terreno">Área do terreno (m²)</label>
          <input id="terreno" inputmode="decimal" placeholder="Ex.: 300">
        </div>
      </fieldset>

      <button type="submit">Calcular</button>
    </form>
    <div id="resultado" aria-live="polite"></div>
  </main>

  <script type="module">
    import { valorPorMetroQuadrado, areaDoTerreno, formatarReais, formatarArea } from './calculo.js';

    // Converte "450.000,50" ou "450000.50" em número
    function lerNumero(texto) {
      const t = texto.trim().replace(/[R$\s]/g, '');
      if (t.includes(',')) return Number(t.replace(/\./g, '').replace(',', '.'));
      return Number(t);
    }

    const campo = (id) => document.getElementById(id).value.trim();
    const resultado = document.getElementById('resultado');

    document.querySelectorAll('input[name="modo"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        const porMedidas = radio.value === 'medidas';
        document.getElementById('campos-medidas').hidden = !porMedidas;
        document.getElementById('campos-area').hidden = porMedidas;
      });
    });

    // Retorna a área do terreno em m², ou null se não foi informada
    function lerTerreno() {
      const modo = document.querySelector('input[name="modo"]:checked').value;
      if (modo === 'area') {
        return campo('terreno') ? lerNumero(campo('terreno')) : null;
      }
      if (!campo('frente') && !campo('fundo')) return null;
      return areaDoTerreno(lerNumero(campo('frente')), lerNumero(campo('fundo')));
    }

    const linha = (rotulo, valor) => `<div class="linha"><span>${rotulo}</span><strong>${valor}</strong></div>`;

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        const valor = lerNumero(campo('valor'));
        const construida = lerNumero(campo('construida'));
        let html = linha('Valor por m² construído', formatarReais(valorPorMetroQuadrado(valor, construida)));

        const terreno = lerTerreno();
        if (terreno !== null) {
          html += linha('Área do terreno', formatarArea(terreno));
          html += linha('Valor por m² do terreno', formatarReais(valorPorMetroQuadrado(valor, terreno)));
        }
        resultado.innerHTML = html;
      } catch (erro) {
        resultado.innerHTML = `<div class="erro">${erro.message}</div>`;
      }
    });
  </script>
</body>
</html>
